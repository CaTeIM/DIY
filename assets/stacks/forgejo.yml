services:
  server:
    image: codeberg.org/forgejo/forgejo:15.0.6
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__actions__ENABLED=true
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # Endereco publico da instancia (links de clone, webhooks, UI).
      # Troque pelo seu dominio, ou pelo seu endereco .onion se for o caso.
      - FORGEJO__server__ROOT_URL=https://git.exemplo.com/
      # Endereco interno usado pelo runner e pelos jobs do CI para falar
      # com o Forgejo sem sair para a internet (ver Parte 5.5 e 5.9 do guia).
      - FORGEJO__server__LOCAL_ROOT_URL=http://forgejo:3000/
    restart: always
    volumes:
      - /srv/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forgejo-net
    ports:
      - '3000:3000'
      - '8122:22'
    hostname: forgejo

  db:
    image: postgres:15-alpine
    container_name: forgejo-db
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD}
      - POSTGRES_DB=forgejo
    volumes:
      - /srv/forgejo/db:/var/lib/postgresql/data
    networks:
      - forgejo-net
    hostname: forgejo-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgejo']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runner que executa os workflows de .forgejo/workflows/*.yml.
  # PRE-REQUISITO (uma vez): crie o runner na UI do Forgejo e grave
  # /srv/forgejo/runner/runner-config.yml com a secao `server` (ver guia, Parte 5).
  # Ate o config existir, o runner reinicia em loop a espera dele.
  #
  # Modo DOOD: os jobs rodam no Docker do HOST (socket montado abaixo) e entram
  # na `forgejo-net` (via `container.network` no runner-config.yml), o que permite
  # resolverem o nome interno `forgejo`. Alternativa mais isolada (dind): Parte 5.6.
  runner:
    image: data.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    command: forgejo-runner daemon --config runner-config.yml
    restart: always
    group_add:
      # GID do grupo `docker` no host: confira com `getent group docker` (3o campo).
      - '989'
    volumes:
      - /srv/forgejo/runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - server
    networks:
      - forgejo-net
    hostname: forgejo-runner

networks:
  forgejo-net:
    name: forgejo-net
    driver: bridge
